<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto Eléctrico</title>
  <!-- Tailwind CSS Oficial -->
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center p-6">

  <div class="max-w-md w-full bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl text-center">
    <!-- Contenedor del Logo de Punto Eléctrico -->
    <div class="flex justify-center mb-6">
      <img src="/paneldecontrol/logo.png" 
           alt="Logo Punto Eléctrico" 
           class="h-40 w-auto object-contain drop-shadow-[0_0_15px_rgba(250,204,21,0.2)]">
    </div>

    <!-- Título Principal -->
    <h1 class="text-3xl font-extrabold text-white mb-2">⚡ Punto Eléctrico</h1>
    <p class="text-gray-400 text-sm mb-8">Plataforma de Integración IoT y Gestión de Terminales de Cobro.</p>

    <!-- Botón de acceso al Panel -->
    <a href="/paneldecontrol" 
       class="inline-block w-full py-3 px-6 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold rounded-lg shadow-lg transition duration-200 transform hover:-translate-y-0.5 text-center">
      Ingresar al Panel de Control
    </a>

    <!-- Footer descriptivo simple -->
    <div class="mt-8 border-t border-gray-700 pt-4 text-xs text-gray-500">
      puntoelectrico.ar &copy; 2026
    </div>
  </div>

</body>
</html>
